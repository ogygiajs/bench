packages:
  - 'packages/*'
  - 'suites/*'
# The app benchmark's framework and scenario apps (suites/apps/frameworks/*,
# suites/apps/scenarios/*/apps/*) are NOT workspace members: build-all.ts installs each one on its
# own, without a lockfile, so every framework keeps the exact pins in its own package.json.

# ONE version per dependency that more than one workspace package uses: `"x": "catalog:"`.
catalog:
  oxfmt: ^0.75.0
  oxlint: ^1.90.0
  # Heisenbench parses with it (the step transform) and so does suites/ogygia (the bench files' import
  # graph); exact, because a parser update can move the AST positions blocks are keyed by.
  oxc-parser: 0.157.0
  rolldown: 1.2.2
  # Builds Heisenbench's npm package (built JavaScript and .d.ts; Node does not strip types in
  # node_modules). The same builder ogygia uses.
  tsdown: ^0.23.7
catalogs:
  # Exact on purpose: a new Lighthouse, Playwright, Chrome launcher or autocannon changes the
  # numbers the app benchmark reports, so they move only by hand. Playwright also matches the
  # Docker image tag in suites/apps/Dockerfile. tinybench is Heisenbench's time layer: a new one changes
  # how latency and throughput are sampled.
  measure:
    autocannon: 8.0.0
    chrome-launcher: 1.2.1
    lighthouse: 13.6.0
    playwright: 1.62.1
    tinybench: 6.2.3
minimumReleaseAgeExclude:
  - rolldown-plugin-dts@0.30.0
  - tsdown@0.23.7
