services:
  bench:
    # The image holds the whole workspace: build from the repository root.
    build:
      context: ../..
      dockerfile: suites/apps/Dockerfile
    volumes:
      - ./results:/bench/suites/apps/results
    environment:
      - CHROME_PATH=/usr/local/bin/chrome
      - ASTRO_TELEMETRY_DISABLED=1
      # Mochi wants a 32-byte key to start; this is a fixed dummy value, not a secret.
      - MOCHI_KEY=dGVzdC1rZXktMzItYnl0ZXMtYmFzZTY0dXJsISEh
      # Which ogygia to build: an npm version/tag or a pkg.pr.new URL (see README).
      - OGYGIA_SPEC=${OGYGIA_SPEC:-latest}
      # BENCH_FAST=1 builds and measures only ogygia + sveltekit.
      - BENCH_FAST=${BENCH_FAST:-}
      - BENCH_PASSES=${BENCH_PASSES:-3}
      # Which scenarios to build and measure: all, none, or a comma list (docs,dashboard,...).
      - BENCH_SCENARIOS=${BENCH_SCENARIOS:-all}
