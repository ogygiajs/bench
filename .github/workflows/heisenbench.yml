name: heisenbench

# Heisenbench (packages/heisenbench) on ogygia's own source: the bench files in ogygia's packages/*/bench, counted
# exactly (steps, allocations and calls per function and line), with V8's engine health and, for
# the cases that declare a scaler, how their steps grow with the input. A PR is also timed (the
# plain build, PR and base taking turns in this job); a main or nightly run adds every plain-build
# layer of its one commit (time, real bytes, leaks) and audits the prices against time at every
# growth size (`heisenbench audit`). suites/ogygia does the work.
#
#   repository_dispatch `ogygia-heisenbench`  ogygia's CI, as soon as a PR is opened or pushed (Heisenbench builds
#                                      from source: no pkg.pr.new preview to wait for). The PR's
#                                      commit against the commit it branched from, both counted in
#                                      this job; only the bench files whose import graph reaches a
#                                      file the PR changes. Posts the `heisenbench` section of the PR's one
#                                      benchmark comment (the first section; the app benchmark fills
#                                      its own when it finishes).
#   repository_dispatch `ogygia-main`  a push to ogygia's main: every bench file of that commit.
#   schedule (nightly)                 every bench file of ogygia's main head, and the worst-case
#                                      search over every case that declares an input.
#   workflow_dispatch                  by hand: `sha`, plus `base_sha` for a PR-style comparison;
#                                      with `pr`, the section is posted to that PR of `comment_repo`.
#                                      Kept as an artifact only.
#
# Counts are exact, so one run of each side decides (no repeats); only the time table is judged by
# the same-job no-overlap noise rule of packages/compare. Results land on
# the `results` branch next to the app benchmark's, under heisenbench/: `heisenbench/pr/<number>.json` (the
# newest run of that PR), `heisenbench/commit/<sha>.json` (the newest run of that commit),
# `heisenbench/main/<sha>.json` and `heisenbench/main/latest.json` (main pushes and the nightly run). A main or
# nightly run also stores real-app weights from the app benchmark's counted scenarios:
# `heisenbench/main/app-weights.json` (the newest, what PRs rank their changes by) and
# `heisenbench/main/app-weights/<sha>.json`.
#
# Separate jobs, because the measuring runs ogygia's code (its install scripts, Vite, the bench
# files, its published build):
#
#   plan             reads the event and decides kind, commits and PR. Nothing else runs here.
#   measure          read-only: no secrets, no write token, no credentials left in .git/config.
#                    Uploads suites/ogygia/out as the `heisenbench-results` artifact.
#   app-weights      (main and nightly) read-only too: counts the app scenarios, uploads
#                    `heisenbench-app-weights`.
#   publish,         the write token (and BENCH_TOKEN for the comment). A fresh checkout of this
#   publish-weights  repository's own scripts; each artifact is read as data and checked against the
#                    plan (packages/compare's validate-artifact.ts) before it is stored or posted.
#                    Nothing from a measuring job or from ogygia runs here. A failed measure job
#                    still updates the PR's section.

on:
  repository_dispatch:
    types: [ogygia-heisenbench, ogygia-main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'ogygia commit to count (full sha)'
        type: string
        required: true
      base_sha:
        description: 'optional: the base it is compared with (a PR run: only bench files reaching the changes)'
        type: string
        default: ''
      pr:
        description: 'optional: post the section to this PR number of comment_repo'
        type: string
        default: ''
      comment_repo:
        description: 'the repository of that PR'
        type: string
        default: ogygiajs/ogygia
      app_weights:
        description: 'also count the app scenarios into real-app weights (kept as an artifact only)'
        type: boolean
        default: false
  schedule:
    - cron: '41 3 * * *'

# A newer push to the same PR cancels the older run. GitHub keeps one running and ONE pending run
# per group, and a newer pending run cancels the one already waiting, so a shared main group would
# drop every push but the newest that arrive during a run. Each main push has its own group (they
# may run side by side; latest.json only moves to a newer commit, see "Store the result"), and the
# nightly run has its own, so it never cancels a waiting push.
concurrency:
  group: >-
    heisenbench-${{ github.event.action == 'ogygia-heisenbench' && format('pr-{0}', github.event.client_payload.pr)
    || github.event.action == 'ogygia-main' && format('main-{0}', github.event.client_payload.sha)
    || github.event_name == 'schedule' && 'nightly'
    || github.run_id }}
  cancel-in-progress: ${{ github.event.action == 'ogygia-heisenbench' }}

# Each job asks for what it needs.
permissions: {}

env:
  UPSTREAM: ogygiajs/ogygia
  NODE_OPTIONS: --experimental-strip-types

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      pr: ${{ steps.plan.outputs.pr }}
      sha: ${{ steps.plan.outputs.sha }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      comment_repo: ${{ steps.plan.outputs.comment_repo }}
    steps:
      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PAYLOAD_PR: ${{ github.event.client_payload.pr }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          PAYLOAD_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_COMMENT_REPO: ${{ inputs.comment_repo }}
        run: |
          set -euo pipefail
          pr=''; sha=''; base_sha=''; comment_repo="$UPSTREAM"
          case "$EVENT/$ACTION" in
            repository_dispatch/ogygia-heisenbench)
              kind='pr'; pr="$PAYLOAD_PR"; sha="$PAYLOAD_SHA"; base_sha="${PAYLOAD_BASE_SHA:-}"
              [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::bad pr in payload: $pr"; exit 1; }
              [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::a PR run needs client_payload.base_sha"; exit 1; }
              ;;
            repository_dispatch/ogygia-main)
              kind=main; sha="$PAYLOAD_SHA"
              ;;
            schedule/*)
              kind=main
              sha="$(git ls-remote "https://github.com/$UPSTREAM.git" refs/heads/main | cut -f1)"
              ;;
            *)
              kind=manual; sha="$INPUT_SHA"; base_sha="${INPUT_BASE_SHA:-}"; pr="${INPUT_PR:-}"
              comment_repo="${INPUT_COMMENT_REPO:-$UPSTREAM}"
              if [ -n "$pr" ]; then [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number"; exit 1; }; fi
              [[ "$comment_repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::bad comment_repo"; exit 1; }
              ;;
          esac
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha: $sha"; exit 1; }
          if [ -n "$base_sha" ] && ! [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::bad base sha: $base_sha"; exit 1
          fi
          {
            echo "kind=$kind"; echo "pr=$pr"; echo "sha=$sha"; echo "base_sha=$base_sha"
            echo "comment_repo=$comment_repo"
          } >> "$GITHUB_OUTPUT"
          echo "### heisenbench: $kind run of ogygia \`${sha:0:7}\`${base_sha:+ against \`${base_sha:0:7}\`}${pr:+ (PR #$pr)}" >> "$GITHUB_STEP_SUMMARY"

  measure:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A PR counts and times what its changes reach; a full run also takes real bytes and leaks of
    # every case (about 15 s a case).
    # The nightly run also has the worst-case search over every case (30 minutes at most).
    timeout-minutes: ${{ github.event.action == 'ogygia-heisenbench' && 45 || github.event_name == 'schedule' && 150 || 120 }}
    steps:
      # No token in .git/config: everything after the install runs ogygia's code.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      # The Node Heisenbench's own tests run on (check.yml): counts and engine health are taken on it.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Heisenbench, the ogygia suite and what they import (typescript for the bench files' types).
      - name: Install
        run: pnpm install --frozen-lockfile --filter '@bench/ogygia...' --config.confirmModulesPurge=false

      # A PR-style run ranks its changed functions by main's real-app weights (the app-weights job
      # of a main run stores them) and, when the owner has uploaded one, by the weights of real
      # production traffic (`heisenbench/main/real-weights.json`, docs/ci.md "Real traffic"): those
      # files of the results branch, read as data. A missing app weights file or branch is said in
      # one line of the section; a missing real-traffic file changes nothing.
      - name: Fetch main's real-app weights
        if: needs.plan.outputs.base_sha != ''
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: results
          path: _weights
          sparse-checkout: |
            heisenbench/main/app-weights.json
            heisenbench/main/real-weights.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # A main or nightly run checks each case's steps over main's earlier full runs for slow
      # creep (suites/ogygia/src/trend.ts, report-only): the results branch, read as data. A
      # blobless clone, so only the runs it reads are fetched. Without it the summary says so.
      - name: Fetch main's earlier runs
        if: needs.plan.outputs.base_sha == ''
        continue-on-error: true
        run: |
          git clone --quiet --filter=blob:none --no-checkout --depth 1 --branch results \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/history"

      # Incremental counting (docs/ci.md#incremental-counting): a case whose code and inputs did
      # not change is not counted again; its counts come from this cache, keyed by content. Every
      # run restores the newest cache a main or nightly run saved; only those runs save one, so
      # nothing a PR's code wrote is ever read by another run.
      - name: Restore the count cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/heisenbench-cache
          key: heisenbench-counts-main-${{ github.run_id }}
          restore-keys: heisenbench-counts-main-

      # Clones ogygia, checks out and installs each commit, writes the bench files' types, selects
      # the bench files and counts them; section.md and result.json land in suites/ogygia/out. A
      # PR-style run also ranks by the weights and runs the worst-case search (4 minutes in all)
      # on the changed cases that declare an input.
      - name: Run Heisenbench on ogygia
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          PR: ${{ needs.plan.outputs.pr }}
          KIND: ${{ needs.plan.outputs.kind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # the nightly run searches every case that declares an input (docs/ci.md#full-runs)
          SEARCH: ${{ github.event_name == 'schedule' && 'all' || '' }}
          SEARCH_BUDGET: ${{ github.event_name == 'schedule' && '1800' || '240' }}
          HISTORY: ${{ needs.plan.outputs.base_sha == '' && format('{0}/history', runner.temp) || '' }}
        run: |
          set -euo pipefail
          node suites/ogygia/src/cli.ts --sha "$SHA" ${BASE_SHA:+--base "$BASE_SHA"} ${PR:+--pr "$PR"} \
            ${HISTORY:+--history "$HISTORY"} \
            ${BASE_SHA:+--weights "$GITHUB_WORKSPACE/_weights/heisenbench/main/app-weights.json"} \
            ${BASE_SHA:+--real-weights "$GITHUB_WORKSPACE/_weights/heisenbench/main/real-weights.json"} \
            ${SEARCH:+--search "$SEARCH"} --search-budget "$SEARCH_BUDGET" \
            --kind "$KIND" --work "$RUNNER_TEMP/heisenbench" --out suites/ogygia/out --run-url "$RUN_URL" \
            --cache "$RUNNER_TEMP/heisenbench-cache"
          cat suites/ogygia/out/section.md >> "$GITHUB_STEP_SUMMARY"

      # A main or nightly run (main's own code only) saves what it counted on top of what it
      # restored; the suite prunes what no run used for two weeks. Saved when the run failed too:
      # what it counted is right.
      - name: Save the count cache
        if: always() && needs.plan.outputs.kind == 'main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/heisenbench-cache
          key: heisenbench-counts-main-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: heisenbench-results
          path: suites/ogygia/out/
          if-no-files-found: ignore

  # Real-app weights (a main or nightly run): the app benchmark's counted scenarios
  # (suites/apps/heisenbench) on that commit's pkg.pr.new build, turned into calls and steps per unit of
  # real work. Read-only like the measure job: it installs and runs that build. Its own job, so a
  # failure here costs only the weights, and the counts are not held up by it.
  app-weights:
    needs: plan
    # A manual run counts them when asked (`app_weights`); only main and nightly runs store them.
    if: needs.plan.outputs.kind == 'main' || (needs.plan.outputs.kind == 'manual' && inputs.app_weights)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      # The apps build on the Node the app benchmark builds them on (bench.yml); the counting below
      # switches to the Node the PR counts are taken on.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Locate the runner's pre-installed Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      # The commit's build on pkg.pr.new (its CDN can lag the dispatch a little).
      - name: Wait for the pkg.pr.new build
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          spec="https://pkg.pr.new/ogygia@${SHA:0:7}"
          for _ in $(seq 1 30); do
            curl -sfIL -o /dev/null "$spec" && { echo "OGYGIA_SPEC=$spec" >> "$GITHUB_ENV"; exit 0; }
            sleep 10
          done
          echo "::error::$spec is not available"
          exit 1

      - name: Install
        run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false

      # The ogygia app of the blog and of every scenario, nothing else.
      - name: Build the ogygia apps
        working-directory: suites/apps
        run: node build-all.ts --only ogygia

      # The Node the PR counts are taken on: weights from another Node are not used for ranking.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Every phase counted twice; an unstable phase or a scenario that did not run is a warning,
      # and the weights come from what did run.
      - name: Count the app scenarios
        working-directory: suites/apps
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/app-weights"
          node heisenbench/run.ts --sha "$SHA" --out "$RUNNER_TEMP/app-weights/app-report.json" \
            || echo "::warning title=App scenarios::not every phase counted cleanly; see the log"

      - name: Real-app weights
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          node suites/ogygia/src/app-weights.ts --sha "$SHA" --out "$RUNNER_TEMP/app-weights/app-weights.json" \
            "$RUNNER_TEMP/app-weights/app-report.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: heisenbench-app-weights
          path: ${{ runner.temp }}/app-weights/app-weights.json

  # Stores what the app-weights job counted, checked like the counts.
  publish-weights:
    needs: [plan, app-weights]
    if: needs.plan.outputs.kind == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: packages/compare

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: actions/download-artifact@v8
        with:
          name: heisenbench-app-weights
          path: ${{ runner.temp }}/artifact

      - name: Check the weights
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          node packages/compare/src/validate-artifact.ts weights --dir "$RUNNER_TEMP/artifact" \
            --out "$RUNNER_TEMP/checked" --kind main --sha "$SHA"

      # heisenbench/main/app-weights/<sha>.json for every main commit, and heisenbench/main/app-weights.json (what
      # PRs rank by) only when this commit is not behind the one it holds.
      - name: Store the weights
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          WEIGHTS: ${{ runner.temp }}/checked/app-weights.json
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dir="$RUNNER_TEMP/results"
          if git ls-remote --exit-code --heads "$url" results >/dev/null; then
            git clone --quiet --branch results "$url" "$dir"
          else
            git init --quiet -b results "$dir"
            git -C "$dir" remote add origin "$url"
          fi
          git -C "$dir" config user.name 'github-actions[bot]'
          git -C "$dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cd "$dir"
          mkdir -p heisenbench/main/app-weights
          cp "$WEIGHTS" "heisenbench/main/app-weights/$SHA.json"
          old=''
          if [ -f heisenbench/main/app-weights.json ]; then
            old="$(node -e 'const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))?.source?.sha; process.stdout.write(/^[0-9a-f]{40}$/.test(s) ? s : "")' heisenbench/main/app-weights.json || true)"
          fi
          order=''
          if [ -n "$old" ] && [ "$old" != "$SHA" ]; then
            order="$(gh api "repos/$UPSTREAM/compare/$old...$SHA" --jq .status 2>/dev/null || true)"
          fi
          if [ "$order" = behind ]; then
            echo "::notice::app-weights.json keeps ${old:0:7}: ${SHA:0:7} is an older commit"
          else
            cp "$WEIGHTS" heisenbench/main/app-weights.json
          fi
          git add -A heisenbench
          git diff --cached --quiet && exit 0
          git commit --quiet -m "heisenbench: app weights ${SHA:0:7}"
          for i in 1 2 3 4 5; do
            git push --quiet origin HEAD:results && exit 0
            sleep $((i * 3))
            git pull --quiet --rebase -X theirs origin results || true
          done
          echo "::error::could not push to the results branch"
          exit 1

  publish:
    needs: [plan, measure]
    # Also after a failed measure job (to say so on the PR); not after a cancel (a newer push won).
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # a manual run may post its section to a PR of this repository (with the job's own token)
      pull-requests: write
    steps:
      # This repository's own scripts, at the workflow's commit: the checker and the upsert script.
      # Neither needs an install.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: packages/compare

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download the counts
        if: needs.measure.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: heisenbench-results
          path: ${{ runner.temp }}/artifact

      # Only result.json and section.md, checked against the plan, are taken from the artifact;
      # the steps below read the checked copies.
      - name: Check the counts
        if: needs.measure.result == 'success'
        env:
          KIND: ${{ needs.plan.outputs.kind }}
          SHA: ${{ needs.plan.outputs.sha }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          PR: ${{ needs.plan.outputs.pr }}
        run: |
          node packages/compare/src/validate-artifact.ts heisenbench --dir "$RUNNER_TEMP/artifact" \
            --out "$RUNNER_TEMP/checked" --kind "$KIND" --sha "$SHA" --base-sha "$BASE_SHA" --pr "$PR"

      - name: Check out the results branch
        if: needs.measure.result == 'success' && needs.plan.outputs.kind != 'manual'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" results >/dev/null; then
            git clone --quiet --branch results "$url" "$RUNNER_TEMP/results"
          else
            git init --quiet -b results "$RUNNER_TEMP/results"
            git -C "$RUNNER_TEMP/results" remote add origin "$url"
          fi
          git -C "$RUNNER_TEMP/results" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/results" config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # Only files under heisenbench/: the app benchmark's paths and the README (bench.yml writes it) stay.
      # Main runs can overlap (each push has its own concurrency group), so latest.json moves only
      # to a commit that is not behind the one it holds, as GitHub's compare API says.
      - name: Store the result
        if: needs.measure.result == 'success' && needs.plan.outputs.kind != 'manual'
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ needs.plan.outputs.kind }}
          PR: ${{ needs.plan.outputs.pr }}
          SHA: ${{ needs.plan.outputs.sha }}
          RESULT: ${{ runner.temp }}/checked/result.json
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/results"
          mkdir -p heisenbench/commit
          cp "$RESULT" "heisenbench/commit/$SHA.json"
          if [ "$KIND" = pr ]; then
            mkdir -p heisenbench/pr
            cp "$RESULT" "heisenbench/pr/$PR.json"
            msg="heisenbench: pr #$PR @ ${SHA:0:7}"
          else
            mkdir -p heisenbench/main
            cp "$RESULT" "heisenbench/main/$SHA.json"
            old=''
            if [ -f heisenbench/main/latest.json ]; then
              old="$(node -e 'const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))?.meta?.sha; process.stdout.write(/^[0-9a-f]{40}$/.test(s) ? s : "")' heisenbench/main/latest.json || true)"
            fi
            order=''
            if [ -n "$old" ] && [ "$old" != "$SHA" ]; then
              order="$(gh api "repos/$UPSTREAM/compare/$old...$SHA" --jq .status 2>/dev/null || true)"
            fi
            if [ "$order" = behind ]; then
              echo "::notice::latest.json keeps ${old:0:7}: ${SHA:0:7} is an older commit"
            else
              cp "$RESULT" heisenbench/main/latest.json
            fi
            msg="heisenbench: main ${SHA:0:7}"
          fi
          git add -A heisenbench
          git diff --cached --quiet && exit 0
          git commit --quiet -m "$msg"
          # Other runs push here too (the app benchmark, other PRs); their files never overlap ours
          # except a rerun of the same commit, where this newer run keeps its file.
          for i in 1 2 3 4 5; do
            git push --quiet origin HEAD:results && exit 0
            sleep $((i * 3))
            git pull --quiet --rebase -X theirs origin results || true
          done
          echo "::error::could not push to the results branch"
          exit 1

      # The `heisenbench` section of the PR's one benchmark comment; the app benchmark's section is kept.
      # A PR of this repository (a manual test) takes the job's own token; ogygia's PRs, BENCH_TOKEN.
      # Only a comment by the token's own login is edited (BENCH_BOT_LOGIN names it when BENCH_TOKEN
      # is a GitHub App's, `<app>[bot]`); a body past GitHub's size limit is cut, linking the run.
      - name: Comment on the PR
        if: needs.measure.result == 'success' && needs.plan.outputs.pr != ''
        env:
          GH_TOKEN: ${{ needs.plan.outputs.comment_repo == github.repository && github.token || secrets.BENCH_TOKEN }}
          BENCH_BOT_LOGIN: ${{ needs.plan.outputs.comment_repo != github.repository && vars.BENCH_BOT_LOGIN || '' }}
          REPO: ${{ needs.plan.outputs.comment_repo }}
          PR: ${{ needs.plan.outputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice title=No PR comment::BENCH_TOKEN is not set, so the result was not posted to $REPO#$PR."
            exit 0
          fi
          node packages/compare/src/upsert-comment.ts --repo "$REPO" --pr "$PR" --section heisenbench \
            --file "$RUNNER_TEMP/checked/section.md" --run-url "$RUN_URL"

      # A failed run still updates its section, so the PR never shows counts for an older commit as
      # if they were current: a measure job that failed, or an artifact this job did not accept.
      - name: Report a failed run on the PR
        if: ${{ !cancelled() && needs.plan.outputs.pr != '' && (failure() || needs.measure.result != 'success') }}
        env:
          GH_TOKEN: ${{ needs.plan.outputs.comment_repo == github.repository && github.token || secrets.BENCH_TOKEN }}
          BENCH_BOT_LOGIN: ${{ needs.plan.outputs.comment_repo != github.repository && vars.BENCH_BOT_LOGIN || '' }}
          REPO: ${{ needs.plan.outputs.comment_repo }}
          PR: ${{ needs.plan.outputs.pr }}
          SHA: ${{ needs.plan.outputs.sha }}
          WHAT: ${{ needs.measure.result == 'success' && 'produced results this job did not accept' || 'failed before it produced counts' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice title=No PR comment::BENCH_TOKEN is not set, so the failure was not posted."
            exit 0
          fi
          node packages/compare/src/upsert-comment.ts --repo "$REPO" --pr "$PR" --section heisenbench \
            --body "$(printf '%s\n' '#### Heisenbench: steps per function' '' \
              "⚠️ The Heisenbench run for \`${SHA:0:7}\` $WHAT. [Heisenbench run]($RUN_URL)")"
