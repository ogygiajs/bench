name: bench

# Measures ogygia builds and keeps the result on the orphan `results` branch.
#
#   repository_dispatch `ogygia-pr`    ogygia's CI, after pkg.pr.new published a PR commit. A/B run:
#                                      the PR's ogygia and its base commit's, built and measured
#                                      in this one job, taking turns; summarised in the `apps`
#                                      section of the ONE benchmark comment on the ogygia PR.
#   repository_dispatch `ogygia-main`  a push to ogygia's main. FULL run (every framework).
#   schedule (weekly)                  FULL run against ogygia@latest.
#   workflow_dispatch                  any mode and spec by hand (A/B with a base spec); result
#                                      kept as an artifact only.
#
# Every run measures the blog and every scenario (docs, dashboard, ai-chat, shop). A PR is never
# compared with a stored result: GitHub-hosted runners differ by up to 2x in server throughput
# for the same code, so only two builds measured on the same machine in the same job compare. The
# A/B run builds and measures the two ogygia apps only (about 25 minutes); FAST runs ogygia +
# sveltekit, FULL every app of every scenario (about 75 minutes).
#
# GitHub-hosted ubuntu-latest ships Google Chrome; Lighthouse's chrome-launcher and Playwright
# both use it as is (no Docker image, no `playwright install`). Frameworks build on Node 22, plus
# bun for mochi.
#
# The app benchmark lives in suites/apps; its run output lands in suites/apps/results/scratch. The
# comment is upserted by packages/compare/src/upsert-comment.ts, which rewrites only the `apps`
# section and keeps every other section (Heisenbench's) as it is.
#
# Three jobs, because measuring installs and runs the ogygia build under test (a PR's, from
# pkg.pr.new) and every framework's dependencies:
#
#   plan     reads the event and decides kind, scope and specs. Nothing else runs here.
#   measure  read-only: no secrets, no write token, no credentials left in .git/config. Uploads
#            run.json and comment.md as the `bench-publish` artifact (and everything as
#            `bench-results`, for people).
#   publish  the write token and BENCH_TOKEN. A fresh checkout of this repository's own scripts;
#            the artifact is read as data and checked against the plan (packages/compare's
#            validate-artifact.ts) before it is stored or posted. Nothing from the measure job or
#            from ogygia runs here. A failed measure job still updates the PR's section. A manual
#            run has nothing to publish.

on:
  repository_dispatch:
    types: [ogygia-pr, ogygia-main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'fast = ogygia + sveltekit, full = every framework'
        type: choice
        options: [fast, full]
        default: fast
      spec:
        description: 'ogygia to install: an npm version or dist-tag, or a pkg.pr.new URL (https://pkg.pr.new/ogygia@<sha7>)'
        type: string
        default: latest
      base_spec:
        description: 'optional: a second ogygia (same forms as spec) measured against it in the same run (A/B; ogygia apps only)'
        type: string
        default: ''
      passes:
        description: 'Lighthouse passes per page and browser-session passes per scenario (the median is reported)'
        type: string
        default: '3'
      scenarios:
        description: 'scenarios to run: all, none, or a comma list (docs,dashboard,ai-chat,shop,blog)'
        type: string
        default: all
  schedule:
    - cron: '17 4 * * 1'

# A newer push to the same PR cancels the older run. Main pushes run one at a time, never
# cancelled once running; GitHub keeps one pending run per group, so of the pushes that arrive
# during a run only the newest waits and the ones between are skipped. The weekly run has its own
# group, so it never takes a waiting push's place.
concurrency:
  group: >-
    bench-${{ github.event.action == 'ogygia-pr' && format('pr-{0}', github.event.client_payload.pr)
    || github.event.action == 'ogygia-main' && 'main'
    || github.event_name == 'schedule' && 'weekly'
    || github.run_id }}
  cancel-in-progress: ${{ github.event.action == 'ogygia-pr' }}

# Each job asks for what it needs.
permissions: {}

env:
  UPSTREAM: ogygiajs/ogygia
  NODE_OPTIONS: --experimental-strip-types

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      scope: ${{ steps.plan.outputs.scope }}
      passes: ${{ steps.plan.outputs.passes }}
      spec: ${{ steps.plan.outputs.spec }}
      pr: ${{ steps.plan.outputs.pr }}
      sha: ${{ steps.plan.outputs.sha }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      base_spec: ${{ steps.plan.outputs.base_spec }}
      scenario_passes: ${{ steps.plan.outputs.scenario_passes }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
    steps:
      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PAYLOAD_PR: ${{ github.event.client_payload.pr }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          PAYLOAD_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SPEC: ${{ inputs.spec }}
          INPUT_BASE_SPEC: ${{ inputs.base_spec }}
          INPUT_PASSES: ${{ inputs.passes }}
          INPUT_SCENARIOS: ${{ inputs.scenarios }}
        run: |
          set -euo pipefail
          pr=''; sha=''; base_sha=''; spec=''; base_spec=''; scenarios=all
          # passes = Lighthouse passes on the blog; scenario_passes = passes of every scenario. An
          # A/B run needs at least three repeats of each build for compare.ts to judge a timing;
          # five make "every PR repeat worse than every base repeat" a 1-in-252 chance for two
          # builds that perform the same.
          case "$EVENT/$ACTION" in
            repository_dispatch/ogygia-pr)
              kind='pr'; scope=fast; passes=5; scenario_passes=5
              pr="$PAYLOAD_PR"; sha="$PAYLOAD_SHA"; base_sha="${PAYLOAD_BASE_SHA:-}"
              [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::bad pr in payload: $pr"; exit 1; }
              ;;
            repository_dispatch/ogygia-main)
              kind=main; scope=full; passes=3; scenario_passes=3; sha="$PAYLOAD_SHA"
              ;;
            schedule/*)
              kind=main; scope=full; passes=3; scenario_passes=3; spec=latest
              ;;
            *)
              kind=manual; scope="${INPUT_MODE:-fast}"; passes="${INPUT_PASSES:-3}"; spec="${INPUT_SPEC:-latest}"
              scenario_passes="$passes"; scenarios="${INPUT_SCENARIOS:-all}"; base_spec="${INPUT_BASE_SPEC:-}"
              [[ "$passes" =~ ^[1-9][0-9]?$ ]] || { echo "::error::passes must be 1-99"; exit 1; }
              [[ "$scenarios" =~ ^[a-z,-]+$ ]] || { echo "::error::scenarios must be all, none or a comma list"; exit 1; }
              ;;
          esac
          if [ -n "$sha" ]; then
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha in payload: $sha"; exit 1; }
            # pkg.pr.new serves each package of a commit at https://pkg.pr.new/<name>@<sha7>.
            spec="https://pkg.pr.new/ogygia@${sha:0:7}"
          fi
          if [ -n "$base_sha" ] && ! [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then base_sha=''; fi
          # The PR's base commit is published to pkg.pr.new like every other push.
          if [ -n "$base_sha" ]; then base_spec="https://pkg.pr.new/ogygia@${base_sha:0:7}"; fi
          [ -n "$spec" ] || { echo "::error::no ogygia spec (a dispatch needs client_payload.sha)"; exit 1; }
          {
            echo "kind=$kind"; echo "scope=$scope"; echo "passes=$passes"; echo "spec=$spec"
            echo "pr=$pr"; echo "sha=$sha"; echo "base_sha=$base_sha"; echo "base_spec=$base_spec"
            echo "scenario_passes=$scenario_passes"; echo "scenarios=$scenarios"
          } >> "$GITHUB_OUTPUT"
          echo "### $kind run, $scope, $passes blog passes, $scenario_passes scenario passes ($scenarios), ogygia \`$spec\`${base_spec:+ against \`$base_spec\`}" >> "$GITHUB_STEP_SUMMARY"

  measure:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A PR (A/B, five repeats of both builds) takes about 25 minutes; FULL builds and measures every
    # app of every scenario.
    timeout-minutes: ${{ github.event.action == 'ogygia-pr' && 60 || 120 }}
    steps:
      # No token in .git/config: the steps below install and run the builds under test.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        if: needs.plan.outputs.scope == 'full'
        with:
          bun-version: latest

      - name: Locate the runner's pre-installed Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          echo "Using Chrome at: $CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      # The dispatch is sent once pkg.pr.new reported success, but its CDN can lag a little. A base
      # build that never shows up turns the A/B run into a run of the PR alone (the comment says so).
      - name: Wait for the pkg.pr.new builds
        id: builds
        env:
          SPEC: ${{ needs.plan.outputs.spec }}
          BASE_SPEC: ${{ needs.plan.outputs.base_spec }}
        run: |
          ready() {
            case "$1" in https://pkg.pr.new/*) ;; *) return 0 ;; esac
            for _ in $(seq 1 30); do
              curl -sfIL -o /dev/null "$1" && return 0
              sleep 10
            done
            return 1
          }
          ready "$SPEC" || { echo "::error::$SPEC is not available"; exit 1; }
          base="$BASE_SPEC"
          if [ -n "$base" ] && ! ready "$base"; then
            echo "::warning::$base is not available, so this run measures the PR alone"
            base=''
          fi
          echo "base_spec=$base" >> "$GITHUB_OUTPUT"

      # The workspace's runtime deps only (Lighthouse, Playwright, autocannon, @bench/compare);
      # rolldown is the router benchmark's and dev-only, oxlint/oxfmt are the check workflow's.
      - name: Install harness deps
        run: pnpm install --prod --frozen-lockfile --config.confirmModulesPurge=false

      # The blog apps and every scenario's apps (FAST: only those marked `fast`).
      - name: Build frameworks
        working-directory: suites/apps
        env:
          OGYGIA_SPEC: ${{ needs.plan.outputs.spec }}
          # An A/B run: every ogygia app a second time, with the base build (ogygia apps only).
          OGYGIA_BASE_SPEC: ${{ steps.builds.outputs.base_spec }}
          SCOPE: ${{ needs.plan.outputs.scope }}
          BENCH_SCENARIOS: ${{ needs.plan.outputs.scenarios }}
        run: node build-all.ts "$([ "$SCOPE" = fast ] && echo --fast || echo --full)"

      - name: Start mochi
        if: needs.plan.outputs.scope == 'full' && steps.builds.outputs.base_spec == ''
        working-directory: suites/apps/frameworks/mochi
        run: |
          PORT=3335 MOCHI_KEY=dGVzdC1rZXktMzItYnl0ZXMtYmFzZTY0dXJsISEh bun run start &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:3335/posts/small >/dev/null && exit 0; sleep 1; done
          echo "::error::mochi did not start"
          exit 1

      # The blog's Lighthouse run, then each scenario: its apps start themselves (a static build
      # served by the harness, or the app's own server on a free port). An A/B run measures the
      # two ogygia builds, interleaved, with every pass kept for compare.ts.
      - name: Run benchmark
        working-directory: suites/apps
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
          BENCH_AB: ${{ steps.builds.outputs.base_spec != '' && '1' || '' }}
          BENCH_PASSES: ${{ needs.plan.outputs.passes }}
          BENCH_SCENARIO_PASSES: ${{ needs.plan.outputs.scenario_passes }}
          BENCH_SCENARIOS: ${{ needs.plan.outputs.scenarios }}
          BENCH_KIND: ${{ needs.plan.outputs.kind }}
          BENCH_SHA: ${{ needs.plan.outputs.sha }}
          BENCH_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          BENCH_PR: ${{ needs.plan.outputs.pr }}
        run: |
          # shellcheck disable=SC2046 # --fast or nothing
          node benchmark.ts $([ "$SCOPE" = fast ] && echo --fast) \
            --config frameworks.config.json --out results/scratch/run.md --json
          cat results/scratch/run.md >> "$GITHUB_STEP_SUMMARY"

      # The PR against its base, both from this run (never a stored result: another run is
      # another machine). A manual A/B run gets the same comment, in its summary.
      - name: Compare the PR with its base
        if: needs.plan.outputs.kind == 'pr' || steps.builds.outputs.base_spec != ''
        working-directory: suites/apps
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node compare.ts --run results/scratch/run.json --run-url "$RUN_URL" --out results/scratch/comment.md
          cat results/scratch/comment.md >> "$GITHUB_STEP_SUMMARY"

      # What the publish job takes: the two files, at the artifact's top level.
      - uses: actions/upload-artifact@v7
        if: needs.plan.outputs.kind != 'manual'
        with:
          name: bench-publish
          path: |
            suites/apps/results/scratch/run.json
            suites/apps/results/scratch/comment.md
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results
          path: |
            suites/apps/results/scratch/
            suites/apps/results/fidelity.md
            suites/apps/results/fidelity-scenarios.md
          if-no-files-found: ignore

  publish:
    needs: [plan, measure]
    # Also after a failed measure job (to say so on the PR); not after a cancel (a newer push won).
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.kind != 'manual' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # This repository's own scripts, at the workflow's commit: the checker and the upsert script.
      # Neither needs an install.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: packages/compare

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the run
        if: needs.measure.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: bench-publish
          path: ${{ runner.temp }}/artifact

      # Only run.json and comment.md, checked against the plan, are taken from the artifact; the
      # steps below read the checked copies. `name` is what the run is kept under: its sha, or
      # `v<version>` for the weekly run of a release.
      - name: Check the run
        id: check
        if: needs.measure.result == 'success'
        env:
          KIND: ${{ needs.plan.outputs.kind }}
          SHA: ${{ needs.plan.outputs.sha }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          PR: ${{ needs.plan.outputs.pr }}
        run: |
          set -euo pipefail
          node packages/compare/src/validate-artifact.ts apps --dir "$RUNNER_TEMP/artifact" \
            --out "$RUNNER_TEMP/checked" --kind "$KIND" --sha "$SHA" --base-sha "$BASE_SHA" --pr "$PR" \
            >> "$GITHUB_OUTPUT"

      - name: Check out the results branch
        if: needs.measure.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Only the newest commit: the branch is squashed by results-gc.yml, so nothing here
          # assumes its history.
          if git ls-remote --exit-code --heads "$url" results >/dev/null; then
            git clone --quiet --depth 1 --branch results "$url" "$RUNNER_TEMP/results"
          else
            # First run: start the orphan branch.
            git init --quiet -b results "$RUNNER_TEMP/results"
            git -C "$RUNNER_TEMP/results" remote add origin "$url"
          fi
          # A note on what the branch holds, rewritten every run so it follows the layout (the
          # store step copies it in, again on every try).
          # shellcheck disable=SC2016 # the backticks are markdown
          printf '%s\n' \
            '# results' '' \
            'Written by the `bench` workflow; nothing here is edited by hand.' '' \
            '- `main/latest.json`: the newest baseline run (a push to ogygia main, or the weekly `ogygia@latest` run)' \
            '- `main/<sha>.json`: every run for an ogygia main commit (`main/v<version>.json` for the weekly run)' \
            '- `pr/<number>.json`: the newest run for that ogygia PR' \
            '- `commit/<sha>.json`: the newest run of that ogygia commit (full sha), from a PR run or a main run alike;' \
            '  `meta.sha` is the commit, `meta.pr` the PR of a PR run, `meta.base` the base commit measured beside it' \
            '- `heisenbench/`: Heisenbench step counts of ogygia'"'"'s bench files, from the `heisenbench` workflow, in the same layout:' \
            '  `heisenbench/pr/<number>.json`, `heisenbench/commit/<sha>.json`, `heisenbench/main/<sha>.json`, `heisenbench/main/latest.json`' \
            '  (each a manifest of the shards it lists in `heisenbench/shards/`, named by their sha256);' \
            '  real-app weights from the counted app scenarios in `heisenbench/main/app-weights.json` (the newest) and' \
            '  `heisenbench/main/app-weights/<sha>.json`' \
            > "$RUNNER_TEMP/results-readme.md"
          git -C "$RUNNER_TEMP/results" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/results" config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Store the result
        if: needs.measure.result == 'success'
        env:
          KIND: ${{ needs.plan.outputs.kind }}
          PR: ${{ needs.plan.outputs.pr }}
          SHA: ${{ needs.plan.outputs.sha }}
          # The run's sha, or `v<version>` for the weekly run (checked by the step above).
          NAME: ${{ steps.check.outputs.name }}
          RUN: ${{ runner.temp }}/checked/run.json
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/results"
          if [ "$KIND" = pr ]; then msg="pr #$PR @ ${SHA:0:7}"; else msg="main $NAME"; fi
          # This run's files, written on top of whatever the branch holds now.
          apply() {
            cp "$RUNNER_TEMP/results-readme.md" README.md
            if [ "$KIND" = pr ]; then
              mkdir -p pr
              cp "$RUN" "pr/$PR.json"
            else
              mkdir -p main
              cp "$RUN" "main/$NAME.json"
              cp "$RUN" main/latest.json
            fi
            # The same file per measured commit, for walking main's history and a PR's commits. The
            # weekly run installs a release and has no sha, so it has no commit file.
            if [ -n "$SHA" ]; then
              mkdir -p commit
              cp "$RUN" "commit/$SHA.json"
            fi
          }
          # Other runs (other PRs, a main push) push here too, and results-gc.yml rewrites the
          # branch as one commit. A rejected push starts again from the branch as it is now: no
          # rebase, no fast-forward assumed. Files overlap only when two runs measured the same
          # commit; then this, the newer run, writes its file last.
          for i in 1 2 3 4 5; do
            apply
            git add -A
            git diff --cached --quiet && exit 0
            git commit --quiet -m "$msg"
            git push --quiet origin HEAD:results && exit 0
            sleep $((i * 3))
            git fetch --quiet --depth 1 origin results && git reset --quiet --hard FETCH_HEAD || true
          done
          echo "::error::could not push to the results branch"
          exit 1

      # The `apps` section of the PR's one benchmark comment; the other sections (Heisenbench's) are kept.
      # Only a comment by the token's own login is edited (BENCH_BOT_LOGIN names it when BENCH_TOKEN
      # is a GitHub App's, `<app>[bot]`); a body past GitHub's size limit is cut, linking the run.
      - name: Comment on the ogygia PR
        if: needs.measure.result == 'success' && needs.plan.outputs.kind == 'pr'
        env:
          GH_TOKEN: ${{ secrets.BENCH_TOKEN }}
          BENCH_BOT_LOGIN: ${{ vars.BENCH_BOT_LOGIN }}
          PR: ${{ needs.plan.outputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice title=No PR comment::BENCH_TOKEN is not set, so the result was not posted to $UPSTREAM#$PR."
            exit 0
          fi
          node packages/compare/src/upsert-comment.ts --repo "$UPSTREAM" --pr "$PR" --section apps \
            --file "$RUNNER_TEMP/checked/comment.md" --run-url "$RUN_URL"

      # A failed run still updates its section, so the PR never shows numbers for an older commit
      # as if they were current: a measure job that failed, or an artifact this job did not accept.
      - name: Report a failed run on the ogygia PR
        if: ${{ !cancelled() && needs.plan.outputs.kind == 'pr' && (failure() || needs.measure.result != 'success') }}
        env:
          GH_TOKEN: ${{ secrets.BENCH_TOKEN }}
          BENCH_BOT_LOGIN: ${{ vars.BENCH_BOT_LOGIN }}
          PR: ${{ needs.plan.outputs.pr }}
          SHA: ${{ needs.plan.outputs.sha }}
          WHAT: ${{ needs.measure.result == 'success' && 'produced results this job did not accept' || 'failed before it produced numbers' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice title=No PR comment::BENCH_TOKEN is not set, so the failure was not posted."
            exit 0
          fi
          node packages/compare/src/upsert-comment.ts --repo "$UPSTREAM" --pr "$PR" --section apps \
            --body "$(printf '%s\n' '#### App benchmark' '' \
              "⚠️ The app benchmark run for \`${SHA:0:7}\` $WHAT. [Benchmark run]($RUN_URL)")"
