name: check

# Tests, lint and format of the workspace, on every push to main and every pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_OPTIONS: --experimental-strip-types

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      # The answer key: every planted slowdown and no-op of every layer, measured by the CLI the way
      # a PR is, with the pass table in the job summary.
      - name: Abax verify
        run: node packages/abax/src/cli.ts verify --md "$RUNNER_TEMP/verify.md"
      - name: Verify table
        if: always()
        run: cat "$RUNNER_TEMP/verify.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      # The fuzzer on fixed seeds (about a minute): random programs checked against V8 (what they
      # do, block, call and allocation counts, callers, inclusive steps, the same report twice and
      # in another process), abax diff on cost-free rewrites and planted costs, block lines through
      # TypeScript and Svelte, runs cut short by the step cap. The same programs every run; the
      # nightly fuzz workflow draws new ones.
      - name: Abax fuzz (fixed seeds)
        run: pnpm --filter @bench/abax fuzz -- --seed 1 --runs 60 --jobs 4 --out "$RUNNER_TEMP/fuzz"
      - name: Fuzz repros
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-repros
          path: ${{ runner.temp }}/fuzz
          if-no-files-found: ignore
