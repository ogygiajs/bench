name: check

# Tests, lint and format of the workspace, on every push to main and every pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_OPTIONS: --experimental-strip-types

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      # The answer key: every planted slowdown and no-op of every layer, measured by the CLI the way
      # a PR is, with the pass table in the job summary.
      - name: Abax verify
        run: node packages/abax/src/cli.ts verify --md "$RUNNER_TEMP/verify.md"
      - name: Verify table
        if: always()
        run: cat "$RUNNER_TEMP/verify.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
